services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts joués une seule fois, à la création du volume.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      # Port hôte configurable : une instance PostgreSQL locale occupe
      # souvent 5432 et gagnerait la course à la liaison.
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      # `docker compose up` ne doit demander aucune intervention manuelle :
      # l'API attend que la base réponde vraiment avant de migrer.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - '${API_PORT:-3333}:3333'

  web:
    build:
      context: ./apps/web
      target: production
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-4200}:80'

volumes:
  postgres-data:
