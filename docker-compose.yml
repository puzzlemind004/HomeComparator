services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # Sans valeur, l'image s'arrête au premier démarrage du volume sur un
      # message qui ne dit pas quoi faire : mieux vaut échouer ici (#18).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (openssl rand -base64 24)}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts joués une seule fois, à la création du volume.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      # Lié à la boucle locale : cette publication ne sert qu'au
      # développement — lancer l'API hors conteneur, jouer les tests
      # fonctionnels — et la notation courte se lierait à 0.0.0.0, ouvrant
      # la base sur le réseau (#18). Le carnet est saisi à la main et
      # irremplaçable (ADR-0001, ADR-0007).
      #
      # Port hôte configurable : une instance PostgreSQL locale occupe
      # souvent 5432 et gagnerait la course à la liaison.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      # `docker compose up` ne doit demander aucune intervention manuelle :
      # l'API attend que la base réponde vraiment avant de migrer.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: production
      args:
        # La version déployée, que le `Dockerfile` fige dans l'image et que
        # la route de santé rend à un appelant muni d'une session (#67).
        # Laissée vide, l'image porte le `dev` que le `Dockerfile` donne par
        # défaut : ici on construit, on ne déploie pas une version publiée.
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    # Aucun `healthcheck:` ici, et c'est délibéré : celui de l'API vit dans
    # son `Dockerfile` (#25, #67). Il décrit l'image, et le VPS tirera des
    # images publiées sans ce fichier — une image qui ne se surveille que
    # depuis le Compose du dépôt ne se surveillerait pas en production.
    # Compose reprend celui de l'image tel quel, et `web` s'en sert plus bas.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      # Sans valeur, l'API refuse de démarrer : mieux vaut un conteneur qui
      # s'arrête qu'un carnet déployé en accès libre (#4).
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD est obligatoire}
      # La racine du stockage des photos, point de montage du volume ci-dessous
      # (#13). Les fichiers ne vivent pas en base : `pg_dump` n'est pas fait
      # pour transporter des mégaoctets de binaire.
      STOCKAGE_PHOTOS: /app/stockage/photos
      # L'horodatage que la sauvegarde quotidienne dépose et que la route de
      # santé lit (#67, #71, ADR-0007). L'API ne sauvegarde pas et n'observe
      # pas qui sauvegarde : elle lit un fichier que l'autre écrit, sur le
      # volume que les deux montent.
      HORODATAGE_SAUVEGARDE: /app/sauvegardes/derniere-sauvegarde
    volumes:
      # Les photos survivent au redémarrage et à la reconstruction des
      # conteneurs, comme la base. Ce volume entre dans le périmètre des
      # sauvegardes au même titre qu'elle (ADR-0007) : les photos de visite
      # sont irremplaçables, on ne repasse pas les prendre.
      - photos-data:/app/stockage/photos
      # L'horodatage des sauvegardes, en lecture seule : l'API le lit, elle
      # n'a aucune raison de pouvoir l'écrire.
      #
      # **C'est `sauvegardes-etat` et non `sauvegardes-data`, et l'écart
      # entre les deux est ce que #75 a tranché.** L'API ne voit que l'état
      # de la sauvegarde ; les archives vivent dans un volume qu'elle ne
      # monte pas du tout. Un dump porte le carnet entier, et le processus
      # qui sert les requêtes HTTP publiques n'a aucun besoin de l'avoir
      # dans son système de fichiers — une traversée de chemin y donnerait
      # accès à tout ce que la sauvegarde existe pour protéger, en plus des
      # données vives.
      #
      # Deux volumes plutôt qu'un `subpath` sur un seul : le sous-chemin
      # d'un volume nommé est créé par Docker s'il manque, et créé en root,
      # ce qui casse silencieusement selon l'ordre de démarrage des deux
      # services. Deux volumes n'ont pas cet ordre à respecter.
      - sauvegardes-etat:/app/sauvegardes:ro
    ports:
      # Lié à la boucle locale, pour deux raisons (#18). En production nginx
      # joint l'API par le réseau interne Compose et cette publication n'a
      # aucun usage. Et la limitation des tentatives de connexion (ADR-0011)
      # compte par adresse en faisant confiance au `X-Forwarded-For`, que
      # nginx écrase mais que ce chemin direct laisse passer tel quel : qui
      # l'atteint depuis une adresse tenue pour interne s'attribue un
      # compteur neuf à chaque tentative. Restreindre la publication à la
      # boucle locale ferme ce contournement au réseau ; il reste ouvert à
      # qui a déjà accès à l'hôte, où seul un pare-feu ne peut rien.
      - '127.0.0.1:${API_PORT:-3333}:3333'

  web:
    build:
      context: ./apps/web
      target: production
    restart: unless-stopped
    depends_on:
      # `service_healthy` et non la forme courte : nginx démarrait jusqu'ici
      # dès que le conteneur de l'API existait, donc pendant que celle-ci
      # jouait encore ses migrations, et les premières requêtes tombaient sur
      # un amont qui ne répondait pas (#25). Le healthcheck de l'image rend
      # cette attente exprimable.
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-4200}:80'

  sauvegarde:
    # Le service qui sauvegarde le carnet chaque nuit (#71, ADR-0007).
    #
    # `postgres:17-alpine`, la **même image que la base** et non une image
    # bâtie pour l'occasion. `pg_dump` doit être d'une version au moins égale
    # à celle du serveur, et la partager est la seule façon que les deux ne
    # divergent jamais : monter la base en 18 sans y penser ici donnerait un
    # `pg_dump` refusant de tourner, la nuit, en silence. L'image est déjà
    # tirée sur la machine, et le service ne coûte donc rien de plus.
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      # Les scripts montés s'ajoutent au PATH, qui porte déjà les binaires
      # PostgreSQL. C'est ce qui rend `sauvegarder.sh` appelable par son seul
      # nom — depuis `boucle.sh`, et surtout depuis la commande manuelle
      # `docker compose exec sauvegarde sauvegarder.sh`, qui est le geste de
      # la sauvegarde à la demande et de la vérification de restauration.
      PATH: /usr/local/sauvegarde:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      POSTGRES_HOTE: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # `PGPASSWORD` et non un argument de ligne de commande : `pg_dump` lit
      # cette variable d'office, et un mot de passe en argument serait
      # lisible dans la liste des processus du conteneur.
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (openssl rand -base64 24)}
      # L'heure de la sauvegarde, en UTC — toute la pile tourne en `TZ: UTC`,
      # et l'heure ne se décale donc pas deux fois l'an.
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-3}
      SAUVEGARDE_MINUTE: ${SAUVEGARDE_MINUTE:-0}
      # La rétention d'ADR-0007. Paramétrable pour que le développement
      # puisse l'éprouver sans attendre onze jours, pas pour être réglée
      # autrement en production.
      SAUVEGARDE_QUOTIDIENNES: ${SAUVEGARDE_QUOTIDIENNES:-7}
      SAUVEGARDE_HEBDOMADAIRES: ${SAUVEGARDE_HEBDOMADAIRES:-4}
    volumes:
      # Les scripts, montés depuis le dépôt : ce qui décrit la production vit
      # dans le dépôt et se déploie d'un geste, là où un crontab posé à la
      # main sur le serveur ne se relit jamais (#71).
      #
      # En développement ils sont **montés**, ce qui les rend modifiables sans
      # reconstruire d'image. En production ils viennent de l'image de l'API,
      # qui les transporte (`apps/api/Dockerfile`) : le VPS n'a pas le dépôt.
      # Les deux Compose diffèrent donc ici, et c'est la seule divergence de
      # ce service.
      - ./apps/api/docker/sauvegarde:/usr/local/sauvegarde:ro
      # Les archives, en écriture. **Ce volume n'est monté nulle part
      # ailleurs** (#75) : ni l'API ni le front ne voient les dumps.
      - sauvegardes-data:/sauvegardes/archives
      # L'état, en écriture ici et en lecture seule dans l'API. C'est le seul
      # point de contact entre les deux services, et il porte un fichier.
      - sauvegardes-etat:/sauvegardes/etat
      # Les Photos, en **lecture seule** : la sauvegarde les lit, elle n'a
      # aucune raison de pouvoir les écrire. La base ne porte que leurs noms
      # (ADR-0014) — une base restaurée sans elles affiche des galeries
      # vides, d'où leur présence dans le même mouvement.
      - photos-data:/photos:ro
    # `entrypoint` et non `command` : l'image PostgreSQL a le sien, qui
    # attend de démarrer un serveur — initialisation du volume de données,
    # attente d'un mot de passe — et qui n'a aucun sens ici. On le remplace
    # entièrement plutôt que de lui passer un argument qu'il ne comprend pas.
    #
    # `sh <script>` et non le script seul : celui-ci arrive par un montage
    # depuis le dépôt, et le bit d'exécution d'un fichier monté dépend du
    # système hôte — Docker Desktop sous Windows le rend exécutable quoi
    # qu'il arrive, un clone Linux respecte le mode enregistré par Git. Passer
    # par l'interpréteur rend le démarrage indifférent à cette différence, qui
    # ne se verrait autrement que sur la machine de quelqu'un d'autre.
    entrypoint: ['sh', '/usr/local/sauvegarde/boucle.sh']

volumes:
  postgres-data:
  photos-data:
  # Les archives : les dumps de la base et les archives de Photos que le
  # service `sauvegarde` produit chaque nuit (#71, ADR-0007). **Seul ce
  # service le monte**, et c'est la décision de #75 : un dump porte le
  # carnet entier, l'API n'a aucun besoin de le voir.
  #
  # Il survit à la reconstruction des conteneurs, comme `postgres-data` et
  # `photos-data` — c'est même sa raison d'être : il porte ce qui permet de
  # les retrouver.
  sauvegardes-data:
  # L'état de la sauvegarde, séparé des archives ci-dessus : le seul
  # horodatage de la dernière réussite, écrit par le service et lu par l'API
  # (#67). Deux volumes et non un, parce que les deux n'ont pas les mêmes
  # lecteurs — c'est le sens de la lecture qui sépare, et non la nature de
  # ce qui y vit.
  sauvegardes-etat:
