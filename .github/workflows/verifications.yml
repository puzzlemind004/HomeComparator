name: Vérifications

# Les trois vérifications du carnet — API, front, images —, dans un workflow
# **appelable** et non déclenché par lui-même (#70).
#
# Pourquoi les extraire : la CI se déclenche sur `main` et sur les pull
# requests, jamais sur un tag. Un déploiement déclenché par un tag ne
# rejouerait donc rien, alors qu'ADR-0007 exige de ne déployer que si tout
# passe. Deux appelants les invoquent désormais — `ci.yml` et `deployer.yml` —
# et c'est le même code qui tourne des deux côtés : une vérification ajoutée
# ici part en production sans qu'on ait à y penser, là où deux copies
# divergeraient en silence.
#
# Ce workflow ne se déclenche sur rien : `workflow_call` est son seul
# événement. Le voir seul dans l'onglet Actions, sans exécution propre, est
# donc normal — il n'apparaît que sous ses appelants.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Le numéro figé dans l'image de l'API à la construction, que la route
          de santé rend ensuite (#67). `dev` en CI, où l'on construit sans
          déployer ; le numéro du tag au déploiement.
        required: false
        type: string
        default: dev
      publier:
        description: >-
          Pousser les images vers GHCR au lieu de seulement les construire.
          Faux en CI : une image par pull request encombrerait le registre
          sans que rien ne la tire jamais.
        required: false
        type: boolean
        default: false

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homecomparator
          POSTGRES_PASSWORD: homecomparator
          POSTGRES_DB: homecomparator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecomparator -d homecomparator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TZ: UTC
      HOST: localhost
      PORT: 3333
      LOG_LEVEL: silent
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: homecomparator
      DB_PASSWORD: homecomparator
      DB_DATABASE: homecomparator_test
      CORS_ORIGIN: http://localhost:4200
      # Mot de passe des tests : les tests de connexion s'y réfèrent par
      # `env.get('APP_PASSWORD')` plutôt que de le recopier.
      APP_PASSWORD: mot-de-passe-de-test
      # Horodatage de la dernière sauvegarde pendant les tests : un fichier à
      # part, écrit et effacé par les tests eux-mêmes (#67). Nommé ici comme
      # dans `.env.test`, qui n'est pas versionné et donc absent de la CI.
      HORODATAGE_SAUVEGARDE: ./tmp/derniere-sauvegarde-test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      # Clé générée par exécution : rien de sensible n'est versionné, et
      # les tests n'ont besoin d'aucune clé stable.
      - name: Générer APP_KEY
        run: echo "APP_KEY=$(openssl rand -base64 24)" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Compilation TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

  web:
    name: Front (lint, types, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilation TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    # Aucun `needs` : la construction des images exerce une propriété
    # distincte des lint/types/tests, et le signal est plus utile en
    # parallèle qu'en aval.
    #
    # **Quand ce job pousse, ce parallélisme devient une décision et non plus
    # une commodité** : des images partent vers le registre sans attendre que
    # les tests soient verts. Elles n'en sont pas déployées pour autant — le
    # job qui les tire dépend de `verifications` tout entier, donc d'`api` et
    # de `web` aussi. Le pire cas est une image publiée que rien ne tirera,
    # qui coûte de l'espace sur le registre et rien d'autre ; l'attente, elle,
    # aurait coûté plusieurs minutes à chaque déploiement.

    permissions:
      contents: read
      # Le droit de pousser vers GHCR. Le jeton de l'exécution est ce qui
      # ouvre la session vers le registre (ADR-0017) : aucun identifiant
      # durable n'existe nulle part, ni ici ni sur le VPS.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Le nom du compte doit être en minuscules : le registre refuse les
      # majuscules dans un nom d'image, et `github.repository_owner` porte la
      # casse du compte GitHub telle qu'elle a été choisie.
      - name: Nommer les images
        id: noms
        run: |
          compte=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/$compte/homecomparator-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$compte/homecomparator-web" >> "$GITHUB_OUTPUT"

      - name: Ouvrir la session vers le registre
        if: inputs.publier
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker est le seul mécanisme de déploiement (ADR-0003, ADR-0007) :
      # sans cette étape, la CI valide un artefact qui n'est pas celui qu'on
      # déploie (#19). Une cible de production renommée ou disparue d'un
      # `Dockerfile` fait échouer le job.
      #
      # Les contextes et les cibles recopient ceux que `docker-compose.yml`
      # déclare par service ; les deux restent maintenus séparément, et rien
      # ici ne rattraperait un renommage fait du seul côté de Compose.
      - name: Construire l'image de l'API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: production
          push: ${{ inputs.publier }}
          tags: ${{ steps.noms.outputs.api }}:${{ inputs.version }}
          # `VERSION` fige le numéro dans l'image (#67) : c'est lui que la
          # route de santé rend, et une image construite sans lui dirait
          # `dev` à qui l'interroge. `dev` est très exactement ce que la CI
          # veut annoncer ; le déploiement, lui, passe le numéro du tag.
          build-args: |
            VERSION=${{ inputs.version }}
          # Le cache GHA est cloisonné par clé : sans `scope`, les deux
          # images se partageraient la même entrée et s'évinceraient l'une
          # l'autre à chaque exécution.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Construire l'image du front
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          target: production
          push: ${{ inputs.publier }}
          tags: ${{ steps.noms.outputs.web }}:${{ inputs.version }}
          # Pas de `VERSION` ici : seul le `Dockerfile` de l'API porte cet
          # argument, la version n'étant rendue que par la route de santé.
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
