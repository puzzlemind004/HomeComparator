name: Poser une version

# Le premier des deux workflows de déploiement (#70). Il éprouve `main`,
# inscrit un numéro dans le dépôt, pose le tag, puis appelle `deployer.yml`.
#
# **Les vérifications passent avant l'écriture, et non après** (#105) : le
# numéro est consommé dès que le tag est poussé, donc rien ne doit être
# écrit tant qu'on ignore si le code tient. Le job `verifications-prealables`
# plus bas détaille ce que cet ordre couvre, et ce qu'il ne couvre pas.
#
# **L'appel est explicite et non déclenché par le tag**, pour une raison que
# le job `deployer` plus bas détaille : GitHub ne réveille aucun workflow sur
# un événement produit par le jeton d'une exécution. Le tag reste néanmoins
# ce qui *désigne* la version déployée, et `deployer.yml` conserve son
# déclencheur par tag pour le cas où un tag est poussé à la main.
#
# **Pourquoi taguer depuis GitHub plutôt que depuis sa machine** : un tag posé
# localement désigne ce que le clone contient, qui peut être en retard sur
# `main` de plusieurs commits sans que rien ne le signale. Ici le tag naît sur
# un `main` fraîchement récupéré, et le commit qu'il désigne est celui que ce
# workflow vient de créer. Un dépôt local en retard devient structurellement
# incapable de poser une version.
#
# L'acheteur le déclenche depuis l'onglet Actions, en saisissant le numéro.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version, sans le « v » (ex. 0.1.0)'
        required: true
        type: string

# Deux poses de version simultanées écriraient toutes deux sur `main` et la
# seconde serait rejetée sur un `non-fast-forward` peu parlant. `false` et non
# `cancel-in-progress: true` : on n'interrompt pas une pose en cours, qui a
# peut-être déjà commité.
concurrency:
  group: poser-version
  cancel-in-progress: false

jobs:
  # ── Première barrière : tout passe-t-il, avant d'écrire quoi que ce soit ? ─
  #
  # **Ces vérifications tournent avant la pose du numéro, et l'ordre est le
  # point (#105).** Le job `poser` commite sur `main` et pousse le tag ; une
  # fois le tag poussé, l'étape « Refuser une version déjà posée » interdit
  # de reprendre le même numéro — à raison, puisque reposer un tag
  # déplacerait un numéro publié sur un autre commit. Tout échec postérieur
  # au job `poser` consomme donc définitivement le numéro.
  #
  # C'est ce qui a coûté `v0.2.1` : des tests instables (#99) ont fait échouer
  # le déploiement après la pose du tag, et le numéro a été perdu pour un
  # défaut qui n'avait rien à voir avec la version qu'il désignait.
  #
  # Elles tournent sur `main` tel qu'il est, donc **avant** la montée de
  # version : c'est le code qu'on s'apprête à publier, au numéro près.
  # `publier: false` — les images partent plus tard, du déploiement, où le
  # numéro est figé dans l'image de l'API (#67). Les construire ici sans les
  # pousser vérifie qu'elles se construisent, ce qui est tout ce qu'on
  # demande à ce stade.
  #
  # **Ce que cette barrière ne couvre pas**, et qu'il faut savoir en la
  # lisant : un échec du déploiement lui-même — le VPS, le registre, les
  # contrôles d'après-déploiement — survient toujours après la pose du tag
  # et brûle encore le numéro. C'est ce qui est arrivé à `v0.2.2` jusqu'à
  # `v0.2.4` (#104). Fermer ce reste demanderait de ne taguer qu'après un
  # déploiement réussi, ce qui défait l'ordre dont ADR-0018 dépend — le tag
  # y est ce qui désigne la version, et la vérification d'ascendance porte
  # sur le commit qu'il désigne. Le choix retenu est donc de couvrir ce qui
  # se couvre sans toucher à cet ordre.
  # Le commit est résolu **une seule fois**, et tout le reste s'y rapporte.
  #
  # Sans cela, `main` serait résolu deux fois — ici puis au `checkout` du job
  # `poser` — et les vérifications dureraient assez longtemps (installation
  # des paquets, tests sur Postgres, deux images Docker) pour qu'une fusion
  # de pull request se glisse entre les deux. La barrière validerait alors un
  # commit et le job `poser` en taguerait un autre.
  #
  # Le `concurrency` de ce workflow n'y suffit pas : il sérialise deux poses
  # de version entre elles, alors que ce qui fait bouger `main` ici est une
  # fusion — qui n'est pas une exécution de ce workflow, et que rien ne
  # sérialise avec lui.
  #
  # Le code non vérifié ne partirait pas en production pour autant : le
  # déploiement rejoue tout sur le tag. Mais il s'arrêterait **après** le
  # `git push --atomic`, donc au prix du numéro — précisément ce que l'ordre
  # de ce workflow existe pour éviter.
  resoudre-le-commit:
    name: Fixer le commit à vérifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tete.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Relever la tête de main
        id: tete
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit à vérifier puis à taguer : $sha"

  verifications-prealables:
    name: Vérifications préalables
    needs: resoudre-le-commit
    uses: ./.github/workflows/verifications.yml
    with:
      ref: ${{ needs.resoudre-le-commit.outputs.sha }}
      publier: false
    # `packages: write` alors que `publier: false` : le workflow appelé
    # déclare ce droit sur son job de publication, et les permissions sont
    # validées au **chargement**, avant que le `if:` de ce job ne soit
    # évalué. Un appelant qui ne l'accorde pas fait échouer l'exécution
    # entière au démarrage. Même raison qu'en CI, où c'est déjà expliqué.
    permissions:
      contents: read
      packages: write

  poser:
    name: Inscrire le numéro, commiter, taguer
    needs: [resoudre-le-commit, verifications-prealables]
    runs-on: ubuntu-latest

    permissions:
      # Le droit d'écrire sur `main` et d'y pousser un tag. C'est le seul
      # droit de ce workflow : il ne touche ni au registre, ni au serveur.
      contents: write

    steps:
      # `ref: main` explicitement, et non le défaut : `workflow_dispatch` peut
      # être lancé depuis n'importe quelle branche par le menu de l'onglet
      # Actions, et une version posée depuis une branche de travail est très
      # exactement ce que ce workflow existe pour empêcher.
      #
      # **La branche est récupérée, puis ramenée sur le commit vérifié.**
      # Un `checkout` sur un SHA place le dépôt en *detached HEAD* : il n'y a
      # alors plus de branche locale `main`, et le `git push origin main` de
      # la fin échoue sur « src refspec main does not match any » — après
      # avoir commité et tagué dans le vide. Mesuré sur le run 34895003070.
      #
      # La branche est donc ramenée sur le commit vérifié à l'étape
      # suivante : elle existe localement, son sommet est le commit que les
      # vérifications ont exercé, le `push` a de quoi pousser, et le tag
      # reste solidaire de ce qui a été vérifié.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Se placer sur le commit vérifié
        env:
          ATTENDU: ${{ needs.resoudre-le-commit.outputs.sha }}
        run: |
          # **`switch` et non `checkout`** : c'est la commande dédiée au
          # changement de branche depuis Git 2.23, là où `checkout` mêle
          # aussi la restauration de fichiers. Elle refuse de détacher HEAD
          # sans `--detach` explicite — et un HEAD détaché en silence est
          # très exactement le défaut que cette étape répare.
          #
          # `reset --hard` et non `git branch -f main "$ATTENDU"` : Git
          # refuse de forcer une branche occupée par un arbre de travail, et
          # `actions/checkout` nous a précisément laissés **sur** `main`.
          #
          # Remonter le temps si `main` avait avancé ? L'étape suivante
          # l'interdit : elle compare `origin/main` au commit vérifié et
          # s'arrête s'ils diffèrent. Ici, `$ATTENDU` est donc la tête de
          # `main`, et ce `reset` ne fait que la confirmer.
          git switch main
          git reset --hard "$ATTENDU"
          echo "Sur main, au commit $(git rev-parse HEAD)."

      # **`main` a-t-il bougé pendant les vérifications ?**
      #
      # Le `push` plus bas est `--atomic` sur `main` et le tag : si `main`
      # avait avancé, il serait de toute façon rejeté en non-fast-forward.
      # Le constater ici rend l'arrêt lisible — « quelqu'un a fusionné
      # pendant que tu posais une version » — là où un refus de `push` en
      # fin de course se lit comme un incident de dépôt.
      #
      # Et surtout, l'arrêt survient **avant** toute écriture : ni commit ni
      # tag, donc le numéro reste libre pour la relance.
      - name: Le commit vérifié est-il toujours la tête de main ?
        env:
          ATTENDU: ${{ needs.resoudre-le-commit.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          actuel=$(git rev-parse origin/main)

          if [ "$actuel" != "$ATTENDU" ]; then
            echo "::error::main a avancé pendant les vérifications ($ATTENDU → $actuel)."
            echo "Rien n'a été écrit et le numéro reste libre : relancez la pose de version."
            exit 1
          fi

          echo "main est toujours sur $ATTENDU."

      - name: Vérifier la forme du numéro
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Semver sans le « v » : c'est la forme que portent les deux
          # `package.json` et le tag des images. Le tag Git, lui, prend le
          # « v » — la convention de Git, pas celle de npm.
          #
          # Le contrôle ici plutôt qu'à la relecture : un numéro fautif
          # produirait sinon un `package.json` que npm refuse, découvert
          # après le commit sur `main`.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::« $VERSION » n'est pas un numéro semver (attendu : 0.1.0)."
            exit 1
          fi

      - name: Refuser une version déjà posée
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Reposer un tag existant déploierait un commit différent sous un
          # numéro déjà publié, et les images du registre porteraient alors
          # un contenu qui n'est plus celui que ce numéro désignait. Le
          # constater ici, avant d'écrire quoi que ce soit sur `main`.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Le tag v$VERSION existe déjà. Choisissez le numéro suivant."
            exit 1
          fi

      - name: Inscrire le numéro dans les deux paquets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # `npm version` et non une réécriture à la main : il met à jour le
          # `package.json` **et** le `package-lock.json`, qui porte lui aussi
          # le numéro. Les oublier désaccorderait les deux fichiers, et
          # `npm ci` refuse un lock qui ne correspond pas à son paquet.
          #
          # `--no-git-tag-version` : c'est le tag de la racine du dépôt qu'on
          # veut, un seul, et non deux tags posés par npm dans deux
          # sous-dossiers.
          npm version "$VERSION" --no-git-tag-version --workspaces=false \
            --prefix apps/api
          npm version "$VERSION" --no-git-tag-version --workspaces=false \
            --prefix apps/web

      - name: Commiter et taguer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # L'auteur du commit est le robot de GitHub Actions, et non
          # l'acheteur : le commit est fait par la machine, et l'historique
          # gagne à le dire.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add apps/api/package.json apps/api/package-lock.json \
                  apps/web/package.json apps/web/package-lock.json
          git commit -m "Version $VERSION"

          # Un tag annoté et non léger : il porte un auteur et une date, que
          # `git describe` et l'interface de GitHub savent rendre.
          git tag -a "v$VERSION" -m "Version $VERSION"

          # **Le commit et le tag partent d'un seul `push`, et l'atomicité
          # est le point.** Poussés séparément, un tag qui arrive sans son
          # commit — ou un commit rejeté après un tag déjà posé — laisserait
          # le dépôt dans un état où `deployer.yml` se déclenche sur un
          # `main` qui ne contient pas ce qu'il croit.
          #
          # `--atomic` fait échouer les deux si l'un est refusé, ce qui
          # arrive quand `main` a bougé pendant l'exécution.
          git push --atomic origin main "refs/tags/v$VERSION"

      - name: Dire ce qui a été posé
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Version v$VERSION posée"
            echo
            echo "Le commit est sur \`main\`, le tag \`v$VERSION\` le désigne."
            echo
            echo "Le déploiement enchaîne dans cette même exécution."
          } >> "$GITHUB_STEP_SUMMARY"

  # **Le déploiement est appelé ici, et cet appel n'est pas une commodité :
  # c'est ce qui fait que la chaîne fonctionne.** GitHub refuse de déclencher
  # un workflow sur un événement produit par le `GITHUB_TOKEN` d'une
  # exécution — une garde contre les boucles récursives. Le tag poussé au job
  # précédent ne réveille donc *rien*, et `deployer.yml` resterait immobile
  # si l'on comptait sur son déclencheur `push: tags`.
  #
  # Les deux voies possibles pour contourner cette garde — un jeton personnel
  # ou une application GitHub — supposent toutes deux un secret durable qui
  # expire, précisément ce qu'ADR-0017 écarte pour le registre et pour la
  # même raison : la panne arrive des mois plus tard, sur un message dont la
  # cause est distante de l'effet.
  #
  # L'appel direct n'a besoin d'aucun secret nouveau. `deployer.yml` garde
  # par ailleurs son déclencheur par tag, qui sert au cas où un tag est
  # poussé à la main — et sa vérification d'ascendance couvre ce cas.
  deployer:
    name: Déployer
    needs: poser
    uses: ./.github/workflows/deployer.yml
    with:
      version: ${{ inputs.version }}
    # Les secrets ne descendent pas d'eux-mêmes vers un workflow appelé, et
    # celui-ci a besoin de ceux du VPS.
    secrets: inherit
    permissions:
      contents: read
      packages: write
