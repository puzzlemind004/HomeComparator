name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push qui suit de près un autre annule la CI devenue obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les trois jobs vivaient ici ; ils sont désormais dans un workflow
  # appelable que le déploiement invoque aussi (#70). La CI n'est plus qu'un
  # de ses deux appelants, et c'est ce qui garantit que la production rejoue
  # exactement ce que les pull requests ont exercé.
  verifications:
    name: Vérifications
    uses: ./.github/workflows/verifications.yml
    # Aucun argument : les valeurs par défaut sont celles de la CI — on
    # construit les images sans les publier, et elles portent `dev`, puisque
    # rien ici ne désigne une version à déployer.
    # **`packages: write` est accordé ici alors que la CI ne pousse jamais,
    # et cette concession apparente demande son explication.**
    #
    # Le workflow appelé déclare ce droit sur son job `publier`. Les
    # permissions sont validées au **chargement** du workflow, avant que le
    # `if:` de ce job ne soit évalué : un appelant qui ne l'accorde pas fait
    # donc échouer l'exécution entière au démarrage, sans qu'aucun job ne
    # tourne. Mesuré sur cette branche : `startup_failure` en une seconde,
    # sur un message qui ne nomme pas la cause.
    #
    # Ce que la CI accorde ne lui donne pour autant aucun accès au registre.
    # `publier` est le seul job à s'y connecter, et son `if: inputs.publier`
    # le saute intégralement ici — la CI appelle sans cet argument. Le droit
    # est porté, jamais exercé.
    permissions:
      contents: read
      packages: write
