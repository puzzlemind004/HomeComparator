name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push qui suit de près un autre annule la CI devenue obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homecomparator
          POSTGRES_PASSWORD: homecomparator
          POSTGRES_DB: homecomparator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecomparator -d homecomparator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TZ: UTC
      HOST: localhost
      PORT: 3333
      LOG_LEVEL: silent
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: homecomparator
      DB_PASSWORD: homecomparator
      DB_DATABASE: homecomparator_test
      CORS_ORIGIN: http://localhost:4200
      # Mot de passe des tests : les tests de connexion s'y réfèrent par
      # `env.get('APP_PASSWORD')` plutôt que de le recopier.
      APP_PASSWORD: mot-de-passe-de-test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      # Clé générée par exécution : rien de sensible n'est versionné, et
      # les tests n'ont besoin d'aucune clé stable.
      - name: Générer APP_KEY
        run: echo "APP_KEY=$(openssl rand -base64 24)" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Compilation TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

  web:
    name: Front (lint, types, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilation TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    # Aucun `needs` : la construction des images exerce une propriété
    # distincte des lint/types/tests, et le signal est plus utile en
    # parallèle qu'en aval.

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Docker est le seul mécanisme de déploiement (ADR-0003, ADR-0007) :
      # sans cette étape, la CI valide un artefact qui n'est pas celui qu'on
      # déploie (#19). Une cible de production renommée ou disparue d'un
      # `Dockerfile` fait échouer le job.
      #
      # Les contextes et les cibles recopient ceux que `docker-compose.yml`
      # déclare par service ; les deux restent maintenus séparément, et rien
      # ici ne rattraperait un renommage fait du seul côté de Compose.
      - name: Construire l'image de l'API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: production
          push: false
          # Le cache GHA est cloisonné par clé : sans `scope`, les deux
          # images se partageraient la même entrée et s'évinceraient l'une
          # l'autre à chaque exécution.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Construire l'image du front
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          target: production
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
