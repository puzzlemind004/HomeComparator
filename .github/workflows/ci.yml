name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push qui suit de près un autre annule la CI devenue obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les trois jobs vivaient ici ; ils sont désormais dans un workflow
  # appelable que le déploiement invoque aussi (#70). La CI n'est plus qu'un
  # de ses deux appelants, et c'est ce qui garantit que la production rejoue
  # exactement ce que les pull requests ont exercé.
  verifications:
    name: Vérifications
    uses: ./.github/workflows/verifications.yml
    # Aucun argument : les valeurs par défaut sont celles de la CI — on
    # construit les images sans les publier, et elles portent `dev`, puisque
    # rien ici ne désigne une version à déployer.
    # `packages: write` n'est pas accordé, et l'omission est la décision :
    # la CI ne pousse pas, donc le jeton de ses exécutions — y compris celles
    # des pull requests — n'a aucun droit sur le registre. Le workflow appelé
    # le demande pour son job d'images ; un appelé ne peut qu'abaisser les
    # droits de son appelant, jamais les élever, et l'étape qui pousse est de
    # toute façon conditionnée à `publier`.
    permissions:
      contents: read
      packages: write
