server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le front appelle l'API sous /api : en production les deux sont
    # derrière la même origine, ce qui évite tout préflight CORS.
    location /api/ {
        proxy_pass http://api:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application à page unique : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
