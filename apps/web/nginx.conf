server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le front appelle l'API sous /api : en production les deux sont
    # derrière la même origine, ce qui évite tout préflight CORS.

    # L'adresse réelle du visiteur, rendue à $remote_addr (#69).
    #
    # Un second proxy est apparu devant celui-ci : Caddy termine le TLS et
    # relaie vers ce nginx par le réseau interne de Compose. Sans les deux
    # lignes qui suivent, $remote_addr vaudrait l'adresse de Caddy pour tout
    # le monde, et les `proxy_set_header X-Forwarded-For $remote_addr`
    # ci-dessous poseraient cette même adresse à chaque requête — la
    # limitation des tentatives de connexion (ADR-0011) compte par adresse et
    # deviendrait un compteur global, que n'importe qui pourrait épuiser pour
    # verrouiller le propriétaire.
    #
    # `real_ip_header X-Forwarded-For` : Caddy pose cet en-tête en relayant,
    # et c'est de là que l'adresse est reprise.
    #
    # `set_real_ip_from` déclare **qui a le droit d'être cru** : une adresse
    # unique, celle que `docker-compose.prod.yml` fixe au conteneur de Caddy.
    # C'est le point qui décide, et il se lit à l'envers de ce qu'on pourrait
    # croire : élargir cette confiance ne corrigerait pas l'adresse, elle
    # l'abandonnerait. Un client cru sur parole déclare le `X-Forwarded-For`
    # qu'il veut et s'attribue un compteur neuf à chaque tentative.
    #
    # **Une adresse et non la plage `172.16.0.0/12`, et ce n'est pas un détail
    # de style.** Cette plage est celle des réseaux Docker, et elle contient
    # la passerelle — donc l'adresse par laquelle arrive un client venu de
    # l'hôte, en développement comme partout où un port serait publié sur
    # `web`. La déclarer digne de confiance revenait à croire n'importe quel
    # client direct : mesuré, un `X-Forwarded-For` forgé était alors repris
    # tel quel, là où le fichier d'avant l'écrasait — la protection qu'on
    # croyait rétablir était retournée.
    #
    # **Ni le nom de service `caddy`, qui paraissait pourtant le plus juste.**
    # nginx résout ce nom une fois au démarrage et *refuse de démarrer* s'il
    # ne résout pas : en développement, où aucun service `caddy` n'existe, le
    # conteneur du front entrait en boucle de redémarrage sur un
    # « host not found in set_real_ip_from ». Une adresse littérale ne se
    # résout pas, et reste donc inerte là-bas.
    #
    # En développement cette ligne ne désigne personne : rien ne se présente
    # depuis cette adresse, aucun en-tête n'est cru, et $remote_addr reste ce
    # qu'il a toujours été. C'est ce qui permet de n'entretenir qu'un seul
    # fichier pour l'image que le VPS tire et pour celle que
    # `docker compose up` construit.
    #
    # Faire simplement confiance à l'en-tête entrant — sans déclarer de qui —
    # aurait fait reposer la protection sur le fait qu'aucun port ne mène
    # directement ici. C'est vrai (`docker-compose.prod.yml` ne publie plus
    # rien sur `web`), mais c'est une propriété d'un **autre fichier** : un
    # port republié un jour pour déboguer rouvrirait la brèche sans que rien
    # dans celui-ci n'ait changé. La confiance se déclare donc ici, nommément,
    # et c'est ce que le commentaire du bloc `/api/` annonçait : « le jour où
    # il y en aurait un, c'est ici que la confiance devrait se déclarer
    # explicitement plutôt que de s'hériter. »
    #
    # Le couplage avec `docker-compose.prod.yml` est réel, et c'est la
    # faiblesse connue de ce montage : cette adresse et celle qu'il fixe
    # doivent rester d'accord, et **rien ne le vérifie**. Si elles divergent,
    # nginx cesse de croire Caddy, `$remote_addr` redevient l'adresse du
    # proxy, et la limitation des tentatives compte tout le monde sur un seul
    # compteur — sans que le carnet cesse de répondre. La panne est
    # silencieuse, là où un `DOMAINE` manquant refuse de démarrer.
    #
    # Les deux fichiers se citent donc mutuellement pour que la rupture se
    # voie à la lecture, ce qui est un pis-aller et non une garantie. Le
    # rendre bruyant demanderait de faire de ce fichier un gabarit rempli à
    # l'exécution (l'image nginx sait le faire par `envsubst`), ce qui
    # imposerait une variable au Compose de développement pour une adresse
    # qui n'y sert à rien : arbitrage à instruire à part (#77) plutôt qu'au
    # milieu de la bascule.
    set_real_ip_from 172.30.0.2;
    real_ip_header X-Forwarded-For;

    # L'envoi de photos, et lui seul, a le droit d'être volumineux (#13).
    #
    # nginx refuse par défaut au-delà d'un mégaoctet : un 413 avant même que
    # l'API ne voie la requête, là où c'est elle qui porte le message de refus
    # nommant le fichier en cause. La marge sur les 10 Mo par photo couvre
    # l'envoi d'une série en une fois, tel qu'une visite le produit.
    #
    # Déclaré sur cette route seule plutôt que sur tout `/api/` : le reste du
    # carnet n'envoie que du JSON de quelques kilo-octets, et rien ne
    # justifierait de lui ouvrir le même plafond. Une `location` en expression
    # régulière l'emporte sur le préfixe `/api/` ci-dessous.
    #
    # Les en-têtes sont **répétés et non hérités** : deux `location` sœurs ne
    # se transmettent rien, et un `proxy_set_header` posé dans l'une est
    # absent de l'autre. L'oubli serait silencieux et coûteux — c'est
    # `X-Forwarded-For` qui rend vraie la limitation des tentatives de
    # connexion par adresse (ADR-0011).
    #
    # La partie chemin est ancrée de bout en bout : sans le `$` et la
    # sous-expression, `/api/biens/1/photos-secrets` ou `/api/photoshop`
    # hériteraient du plafond de 60 Mo sans être des routes de photos.
    location ~ ^/api/(biens/[0-9]+/photos(?:/[0-9]+)?)$ {
        # Le groupe capturé, et non `$request_uri` : celui-ci garderait le
        # préfixe `/api`, que l'API ne connaît pas — c'est le `/` final du
        # bloc générique qui le retire là-bas, et une capture qui le fait ici.
        proxy_pass http://api:3333/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 60m;
    }

    location /api/ {
        proxy_pass http://api:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # $remote_addr, et non $proxy_add_x_forwarded_for : l'en-tête est
        # remplacé, jamais allongé (#26).
        #
        # La limitation des tentatives de connexion compte par adresse, et
        # cette ligne est ce qui rend l'adresse incontournable. En allongeant
        # la chaîne, ce qu'un client déclare de lui-même arrive jusqu'à
        # l'API : il lui suffirait d'annoncer une adresse privée — que l'API
        # tient pour fiable puisque c'est de là que nginx l'appelle — pour
        # s'attribuer un compteur neuf à chaque tentative. Ce détour n'est
        # ouvert qu'à un client déjà sur le réseau interne, soit très
        # exactement le déploiement visé, à la maison.
        #
        # Le prix est de perdre la chaîne d'un proxy en amont. Il y en a un
        # depuis #69 — Caddy —, et la confiance se déclare désormais en tête
        # de ce fichier (`set_real_ip_from`) plutôt que de s'hériter : c'est
        # ce que ce commentaire annonçait, et c'est fait. **Cette ligne n'a
        # pas eu à changer pour autant**, et c'est la propriété qui la rend
        # juste : `realip` corrige $remote_addr *avant* qu'elle ne s'évalue,
        # si bien qu'elle pose maintenant l'adresse réelle du visiteur là où
        # elle posait celle du seul client direct. Ce qu'elle dit — l'API ne
        # reçoit qu'une adresse, celle que nginx a posée, la seule que le
        # client ne choisisse pas — reste vrai mot pour mot.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application à page unique : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
