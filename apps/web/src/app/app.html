<!--
  La coque du carnet : la barre de marque, puis l'écran courant.

  La marque est une barre et non plus un titre de page (`h1`) : chaque écran
  porte désormais le sien — « Mes Biens », « Photos », le Libellé d'un Bien —
  et deux titres de premier rang sur une page en feraient un de trop pour le
  lecteur d'écran (ADR-0005). La marque nomme l'application ; le titre nomme
  ce qu'on regarde.
-->
<div class="coque">
  <!--
    La barre ne paraît qu'une fois connecté. L'écran de connexion porte déjà
    le nom du produit en grand, et le répéter au-dessus en ferait deux fois
    le même mot sur le seul écran qui n'a rien d'autre à montrer.
  -->
  @if (authentifie()) {
    <header class="marque">
      <span class="marque__nom">{{ title() }}</span>

      <button type="button" class="deconnexion" (click)="deconnecter()">Se déconnecter</button>
    </header>

    <!--
      La navigation du carnet (#124). Elle est dans la coque et non dans un
      écran : elle doit survivre au changement d'écran, et c'est ce qui lui
      permet de porter le compte de la sélection partout.

      Elle ne paraît qu'une fois connecté, pour la même raison que la marque :
      les trois écrans qu'elle propose sont derrière le garde de route, et un
      menu qui renverrait à la connexion ne serait pas une navigation.

      Elle est montée une seule fois pour les deux dispositions de la maquette
      — pied fixe sur mobile, barre en tête sur desktop : c'est la feuille de
      style qui choisit, et deux instances feraient annoncer deux navigations
      à un lecteur d'écran (ADR-0005).
    -->
    <app-navigation />
  }

  <main class="page">
    <router-outlet />

    @if (health(); as health) {
      @if (health.reachable) {
        <section class="health" [class.health--ko]="health.status !== 'ok'">
          <h2>État du service</h2>
          <dl>
            <dt>API</dt>
            <dd>{{ health.status }}</dd>
            <dt>Base de données</dt>
            <dd>{{ health.database }}</dd>
          </dl>
        </section>
      } @else {
        <section class="health health--ko">
          <h2>État du service</h2>
          <p>API injoignable.</p>
        </section>
      }
    } @else {
      <p class="health health--pending">Interrogation de l'API…</p>
    }
  </main>
</div>
